<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
  <defs>
    <pattern id="hz" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
      <rect width="12" height="24" fill="#d4ff3a"/><rect x="12" width="12" height="24" fill="#070707"/>
    </pattern>
    <style>.mv{animation:mv 1.2s linear infinite}@keyframes mv{to{transform:translateX(24px)}}</style>
    <clipPath id="c"><rect width="1200" height="24" rx="4"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect x="-24" width="1248" height="24" fill="url(#hz)" class="mv"/>
    <rect x="510" y="0" width="180" height="24" fill="#070707"/>
    <text x="600" y="17" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="12" font-weight="700" letter-spacing="3" fill="#d4ff3a">AI-POWERED</text>
  </g>
</svg>
