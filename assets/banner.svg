<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.025"/></pattern>
    <pattern id="noise" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="7" r="0.6" fill="#fff" opacity="0.08"/><circle cx="23" cy="31" r="0.6" fill="#fff" opacity="0.06"/>
      <circle cx="31" cy="12" r="0.5" fill="#fff" opacity="0.07"/><circle cx="12" cy="25" r="0.5" fill="#fff" opacity="0.05"/>
    </pattern>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity="0.45"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="440" rx="20"/></clipPath>
    <path id="circ" d="M 960 210 m -120 0 a 120 120 0 1 1 240 0 a 120 120 0 1 1 -240 0"/>
    <style>
      .h{font-family:'Arial Black','Segoe UI Black','Helvetica Neue',Impact,sans-serif;font-weight:900}
      .m{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace}
      .rot{transform-origin:960px 210px;animation:rot 22s linear infinite}
      @keyframes rot{to{transform:rotate(360deg)}}
      .ticker{animation:tick 18s linear infinite}
      @keyframes tick{to{transform:translateX(-837px)}}
      .strike{stroke-dasharray:420;stroke-dashoffset:420;animation:strike .6s cubic-bezier(.7,0,.3,1) 1.4s forwards}
      @keyframes strike{to{stroke-dashoffset:0}}
      .reveal{opacity:0;animation:rev .5s ease 2s forwards}
      @keyframes rev{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .in{animation:in .8s cubic-bezier(.2,.9,.2,1) both}
      .i1{animation-delay:.1s}.i2{animation-delay:.25s}.i3{animation-delay:.4s}
      @keyframes in{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
      .blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
      .glitch{animation:gl 4s steps(1) infinite}
      @keyframes gl{0%,92%,100%{transform:none;opacity:0}93%{transform:translate(6px,-2px);opacity:.9}95%{transform:translate(-5px,2px);opacity:.9}97%{transform:translate(3px,0);opacity:.6}}
      .n{animation:np 2.4s ease-in-out infinite}
      @keyframes np{0%,100%{r:4}50%{r:7}}
      .flow{stroke-dasharray:4 10;animation:flow 1.2s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-28}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="#070707"/>
    <circle cx="960" cy="210" r="260" fill="url(#heat)"/>
    <rect width="1200" height="440" fill="url(#noise)"/>

    <!-- neural core -->
    <g stroke="#d4ff3a" stroke-opacity="0.35" stroke-width="1.2" fill="none">
      <path class="flow" d="M870 140 L960 210 L1050 130"/><path class="flow" d="M860 270 L960 210 L1060 290"/>
      <path class="flow" d="M900 330 L960 210 L1030 80"/><path class="flow" d="M840 200 L960 210 L1080 210"/>
    </g>
    <g fill="#d4ff3a">
      <circle class="n" cx="870" cy="140" r="4"/><circle class="n" cx="1050" cy="130" r="4" style="animation-delay:.4s"/>
      <circle class="n" cx="860" cy="270" r="4" style="animation-delay:.8s"/><circle class="n" cx="1060" cy="290" r="4" style="animation-delay:1.2s"/>
      <circle class="n" cx="900" cy="330" r="4" style="animation-delay:1.6s"/><circle class="n" cx="1030" cy="80" r="4" style="animation-delay:2s"/>
      <circle class="n" cx="840" cy="200" r="4" style="animation-delay:.6s"/><circle class="n" cx="1080" cy="210" r="4" style="animation-delay:1s"/>
    </g>
    <circle cx="960" cy="210" r="62" fill="#070707" stroke="#ff6a1a" stroke-width="2"/>
    <text x="960" y="222" text-anchor="middle" class="h" font-size="38" fill="#ff6a1a">AI</text>
    <g class="rot">
      <text class="m" font-size="13" letter-spacing="5.6" fill="#f5f5f0">
        <textPath href="#circ">HUMAN DIRECTS ✦ MACHINE BUILDS ✦ HUMAN DIRECTS ✦ MACHINE BUILDS ✦ </textPath>
      </text>
    </g>

    <!-- top bar -->
    <text x="48" y="54" class="m" font-size="12" letter-spacing="3" fill="#6b6b6b">PROFILE://BANKKYZ</text>
    <rect x="236" y="42" width="128" height="18" fill="#d4ff3a"/>
    <text x="300" y="55" text-anchor="middle" class="m" font-size="11" font-weight="700" letter-spacing="2" fill="#070707">AI-NATIVE</text>
    <text x="1152" y="54" text-anchor="end" class="m" font-size="12" letter-spacing="3" fill="#6b6b6b">EST. 2025 · TH</text>

    <!-- name -->
    <g class="in i1">
      <text x="44" y="178" class="h" font-size="124" letter-spacing="-4" fill="#f5f5f0">BANKKYZ</text>
      <g class="glitch"><text x="44" y="178" class="h" font-size="124" letter-spacing="-4" fill="#ff6a1a" opacity="0.8">BANKKYZ</text></g>
    </g>

    <!-- manifesto -->
    <g class="in i2">
      <text x="48" y="236" class="h" font-size="34" fill="#6b6b6b">I DON'T WRITE CODE.</text>
      <line class="strike" x1="44" y1="224" x2="456" y2="224" stroke="#ff6a1a" stroke-width="5"/>
    </g>
    <g class="reveal">
      <text x="48" y="284" class="h" font-size="34" fill="#d4ff3a">I DIRECT AI TO BUILD ANYTHING.<tspan class="blink" fill="#f5f5f0">_</tspan></text>
    </g>
    <text x="48" y="322" class="m in i3" font-size="13" letter-spacing="2" fill="#a3a3a3">apps · shops · systems · video · voice · automation — idea in, product out.</text>

    <!-- ticker -->
    <rect x="0" y="372" width="1200" height="44" fill="#d4ff3a"/>
    <g class="ticker">
      <text x="0" y="401" class="h" font-size="20" letter-spacing="1" fill="#070707">PROMPT → PRODUCT ✦ ANY IDEA ✦ ANY STACK ✦ SHIPPED WITH AI ✦ PROMPT → PRODUCT ✦ ANY IDEA ✦ ANY STACK ✦ SHIPPED WITH AI ✦ PROMPT → PRODUCT ✦ ANY IDEA ✦ ANY STACK ✦ SHIPPED WITH AI ✦</text>
    </g>
    <rect width="1200" height="440" fill="url(#scan)"/>
  </g>
</svg>
