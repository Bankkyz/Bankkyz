<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="0.8" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <style>.s{animation:s 3s ease-in-out infinite}@keyframes s{from{transform:translateX(-100px)}to{transform:translateX(1200px)}}</style>
  </defs>
  <rect x="0" y="5" width="1200" height="2" fill="url(#g)"/>
  <rect class="s" x="0" y="4" width="90" height="4" rx="2" fill="#fff" opacity="0.8"/>
</svg>
