<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">
  <defs><style>
  .h{font-family:'Arial Black','Segoe UI Black','Helvetica Neue',Impact,sans-serif;font-weight:900}
  .m{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace}

    .type{animation:type 2.2s steps(42) .3s both}@keyframes type{from{width:0}to{width:500px}}
    .think{opacity:0;animation:th 1s ease 2.5s both}@keyframes th{to{opacity:1}}
    .out{opacity:0;animation:out .6s cubic-bezier(.2,.9,.2,1) 3s both}@keyframes out{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .d{animation:d 1s ease-in-out infinite}@keyframes d{50%{opacity:.2}}
    .pip{animation:d 1.6s ease-in-out infinite}
  </style>
  <clipPath id="c"><rect width="560" height="250" rx="16"/></clipPath>
  <clipPath id="t"><rect class="type" x="30" y="44" height="30"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="560" height="250" fill="#0d0d0d"/>
    <text x="30" y="34" class="m" font-size="11" letter-spacing="2" fill="#6b6b6b">PROMPT ›</text>
    <text x="30" y="64" class="m" font-size="14" fill="#f5f5f0" clip-path="url(#t)">“turn our memories into an interactive gift”</text>
    <g class="think"><circle class="d" cx="34" cy="96" r="3" fill="#ff6a1a"/><circle class="d" cx="46" cy="96" r="3" fill="#ff6a1a" style="animation-delay:.2s"/><circle class="d" cx="58" cy="96" r="3" fill="#ff6a1a" style="animation-delay:.4s"/>
      <text x="72" y="100" class="m" font-size="11" fill="#ff6a1a">AI building…</text></g>
    <g class="out">
      <rect x="0" y="118" width="560" height="132" fill="#1a1a1a"/>
      <text x="30" y="146" class="m" font-size="11" font-weight="700" letter-spacing="2" fill="#6b6b6b">✓ SHIPPED · SOURCE</text>
      
      <text x="28" y="196" class="h" font-size="40" letter-spacing="-1.5" fill="#f5f5f0">LOVE MEMORY</text>
      <text x="30" y="226" class="m" font-size="12" fill="#d4ff3a">github.com/Bankkyz/Love-Memory ↗</text>
      <text x="530" y="226" text-anchor="end" class="m" font-size="10" fill="#6b6b6b" opacity="0.7">2025-11-03</text>
    </g>
  </g>
</svg>
